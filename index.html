<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Peace Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start" class="screen">
  <h1>Scan Successful ✅</h1>
  <p>Arrange the memory to unlock the message</p>
  <button onclick="startGame()">Start Puzzle</button>
</div>

<div id="game" class="screen hidden">
  <h2>Fix the Memory 🧩</h2>
  <div id="puzzle"></div>
</div>

<div id="win" class="screen hidden">
  <h1>Memory Restored 🎉</h1>
  <p>I’m really sorry… 🤍</p>
</div>

<script src="script.js"></script>
</body>
</html>
